<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI Chatbot</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #0f0f11;
      color: #e8e8e8;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .chat-wrapper {
      width: 100%;
      max-width: 720px;
      height: 100vh;
      display: flex;
      flex-direction: column;
      padding: 0 1rem;
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 1.25rem 0 1rem;
      border-bottom: 1px solid #222;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .logo-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #a87ffb;
      box-shadow: 0 0 8px #a87ffb88;
    }

    header h1 { font-size: 15px; font-weight: 500; color: #ccc; letter-spacing: 0.3px; }

    #reset-btn {
      background: none;
      border: 1px solid #333;
      color: #888;
      font-size: 12px;
      padding: 5px 12px;
      border-radius: 6px;
      cursor: pointer;
      transition: border-color 0.15s, color 0.15s;
    }
    #reset-btn:hover { border-color: #555; color: #ccc; }

    #messages {
      flex: 1;
      overflow-y: auto;
      padding: 1.5rem 0;
      display: flex;
      flex-direction: column;
      gap: 1.25rem;
      scrollbar-width: thin;
      scrollbar-color: #333 transparent;
    }

    .msg {
      display: flex;
      flex-direction: column;
      gap: 4px;
      max-width: 85%;
      animation: fadeUp 0.2s ease;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(6px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .msg.user { align-self: flex-end; align-items: flex-end; }
    .msg.assistant { align-self: flex-start; align-items: flex-start; }

    .msg-label { font-size: 11px; color: #555; text-transform: uppercase; letter-spacing: 0.5px; }

    .bubble {
      padding: 0.65rem 1rem;
      border-radius: 14px;
      font-size: 14.5px;
      line-height: 1.6;
    }

    .msg.user .bubble {
      background: #a87ffb22;
      border: 1px solid #a87ffb44;
      color: #e4d9ff;
    }

    .msg.assistant .bubble {
      background: #1c1c1f;
      border: 1px solid #2a2a2e;
      color: #ddd;
      white-space: pre-wrap;
    }

    .bubble.typing {
      display: flex;
      gap: 5px;
      align-items: center;
      padding: 0.75rem 1rem;
    }

    .dot {
      width: 6px; height: 6px;
      border-radius: 50%;
      background: #555;
      animation: bounce 1.1s infinite;
    }
    .dot:nth-child(2) { animation-delay: 0.18s; }
    .dot:nth-child(3) { animation-delay: 0.36s; }

    @keyframes bounce {
      0%, 80%, 100% { transform: translateY(0); opacity: 0.4; }
      40%           { transform: translateY(-5px); opacity: 1; }
    }

    .empty-state {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 8px;
      color: #444;
      pointer-events: none;
    }
    .empty-state span { font-size: 28px; }
    .empty-state p { font-size: 13px; }

    .input-row {
      display: flex;
      gap: 8px;
      padding: 1rem 0 1.25rem;
      border-top: 1px solid #1e1e1e;
    }

    #user-input {
      flex: 1;
      background: #1c1c1f;
      border: 1px solid #2a2a2e;
      color: #e8e8e8;
      font-size: 14px;
      padding: 0.65rem 1rem;
      border-radius: 10px;
      outline: none;
      resize: none;
      height: 44px;
      max-height: 120px;
      overflow-y: auto;
      line-height: 1.5;
      font-family: inherit;
      transition: border-color 0.15s;
    }
    #user-input:focus { border-color: #a87ffb66; }
    #user-input::placeholder { color: #444; }

    #send-btn {
      width: 44px; height: 44px;
      background: #a87ffb;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      transition: background 0.15s, transform 0.1s;
    }
    #send-btn:hover { background: #c4a0ff; }
    #send-btn:active { transform: scale(0.95); }
    #send-btn:disabled { background: #333; cursor: not-allowed; }
    #send-btn svg { width: 18px; height: 18px; fill: white; }
  </style>
</head>
<body>
<div class="chat-wrapper">
  <header>
    <div class="logo">
      <div class="logo-dot"></div>
      <h1>AI Chatbot — Claude</h1>
    </div>
    <button id="reset-btn">New chat</button>
  </header>

  <div id="messages">
    <div class="empty-state" id="empty-state">
      <span>💬</span>
      <p>Send a message to start chatting</p>
    </div>
  </div>

  <div class="input-row">
    <textarea id="user-input" placeholder="Message Claude…" rows="1"></textarea>
    <button id="send-btn" aria-label="Send">
      <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
        <path d="M2 21l21-9L2 3v7l15 2-15 2z"/>
      </svg>
    </button>
  </div>
</div>

<script>
  const messagesEl = document.getElementById("messages");
  const inputEl    = document.getElementById("user-input");
  const sendBtn    = document.getElementById("send-btn");
  const resetBtn   = document.getElementById("reset-btn");
  const emptyState = document.getElementById("empty-state");

  // Unique session per page load
  const sessionId = crypto.randomUUID();

  function addMessage(role, text) {
    emptyState.style.display = "none";
    const wrap = document.createElement("div");
    wrap.className = `msg ${role}`;
    const label = document.createElement("div");
    label.className = "msg-label";
    label.textContent = role === "user" ? "You" : "Claude";
    const bubble = document.createElement("div");
    bubble.className = "bubble";
    bubble.textContent = text;
    wrap.appendChild(label);
    wrap.appendChild(bubble);
    messagesEl.appendChild(wrap);
    messagesEl.scrollTop = messagesEl.scrollHeight;
    return bubble;
  }

  function addTyping() {
    emptyState.style.display = "none";
    const wrap = document.createElement("div");
    wrap.className = "msg assistant";
    wrap.id = "typing-indicator";
    const label = document.createElement("div");
    label.className = "msg-label";
    label.textContent = "Claude";
    const bubble = document.createElement("div");
    bubble.className = "bubble typing";
    bubble.innerHTML = '<div class="dot"></div><div class="dot"></div><div class="dot"></div>';
    wrap.appendChild(label);
    wrap.appendChild(bubble);
    messagesEl.appendChild(wrap);
    messagesEl.scrollTop = messagesEl.scrollHeight;
    return wrap;
  }

  async function sendMessage() {
    const text = inputEl.value.trim();
    if (!text) return;

    inputEl.value = "";
    inputEl.style.height = "44px";
    sendBtn.disabled = true;

    addMessage("user", text);
    const typingEl = addTyping();

    try {
      const res = await fetch("/api/chat", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ message: text, sessionId }),
      });
      const data = await res.json();
      typingEl.remove();
      if (data.reply) {
        addMessage("assistant", data.reply);
      } else {
        addMessage("assistant", "⚠️ " + (data.error || "Unknown error"));
      }
    } catch (err) {
      typingEl.remove();
      addMessage("assistant", "⚠️ Network error. Is the server running?");
    } finally {
      sendBtn.disabled = false;
      inputEl.focus();
    }
  }

  sendBtn.addEventListener("click", sendMessage);
  inputEl.addEventListener("keydown", (e) => {
    if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); sendMessage(); }
  });

  // Auto-grow textarea
  inputEl.addEventListener("input", () => {
    inputEl.style.height = "44px";
    inputEl.style.height = Math.min(inputEl.scrollHeight, 120) + "px";
  });

  resetBtn.addEventListener("click", async () => {
    await fetch("/api/reset", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ sessionId }),
    });
    messagesEl.innerHTML = "";
    messagesEl.appendChild(emptyState);
    emptyState.style.display = "flex";
  });
</script>
</body>
</html>
